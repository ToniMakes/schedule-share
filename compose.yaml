services:
  postgres:
    image: postgres:17-alpine
    container_name: schedule-share-postgres
    environment:
      POSTGRES_DB: schedule_share
      POSTGRES_PASSWORD: schedule_share
      POSTGRES_USER: schedule_share
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule_share -d schedule_share"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
